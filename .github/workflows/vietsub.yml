name: Tự Động Vietsub Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt FFmpeg & Phông chữ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-comfortaa fonts-roboto fontconfig
          sudo fc-cache -fv

      - name: Cài đặt thư viện Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy Script Xử Lý Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run.py

      - name: Đăng video thẳng lên mục Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: vietsub-run-${{ github.run_number }}
          name: "Video Hoàn Thành - Lượt #${{ github.run_number }}"
          body: "Render và lồng tiếng hoàn tất lúc đi ngủ!"
          files: output_videos/*
