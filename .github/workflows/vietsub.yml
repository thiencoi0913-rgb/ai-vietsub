name: Tự Động Vietsub Video từ Release

on:
  release:
    types: [published] # Tự động chạy ngay khi bạn bấm nút Phát hành màu xanh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt FFmpeg & Phông chữ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-comfortaa fonts-roboto fontconfig
          sudo fc-cache -fv

      - name: Cài đặt thư viện Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lấy video bạn vừa gửi ở Release về xử lý
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input_videos
          gh release download ${{ github.event.release.tag_name }} --pattern "*.mp4" --pattern "*.mov" --dir input_videos/ || true

      - name: Chạy Script Vietsub & Lồng tiếng
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run.py

      - name: Đẩy video thành phẩm ngược lại đúng Release này
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} output_videos/* --clobber
